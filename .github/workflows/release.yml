name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest

    steps:
      - name: Derive release version from tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag must match vX.Y.Z (e.g. v1.2.3)." >&2
            exit 1
          fi

          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Package Chrome extension
        run: npm run zip

      - name: Package Edge extension
        run: npm run zip:edge

      - name: Name release artifacts
        run: |
          cp .output/*-chrome.zip "dayboard-chrome-${RELEASE_VERSION}.zip"
          cp .output/*-edge.zip "dayboard-edge-${RELEASE_VERSION}.zip"

      # This job can write to the repository, so it uses the runner's own gh CLI rather than a third-party action.
      # A release that already exists (one written ahead of the tag, or a rerun) keeps its title and notes, and only its zips are replaced. Teichos's release does the same.
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "" --verify-tag
          gh release upload "$RELEASE_TAG" "dayboard-chrome-${RELEASE_VERSION}.zip" "dayboard-edge-${RELEASE_VERSION}.zip" --clobber
