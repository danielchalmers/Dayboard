name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck
        run: npm run typecheck

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Unit tests
        run: npm run test

  e2e:
    name: Extension E2E
    runs-on: ubuntu-latest
    needs: [static, unit]
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  package:
    name: Package Extension (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [static, unit]
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, edge]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # The same scripts the release job runs, so a broken zip shows up here rather than on a tag.
      - name: Build zip
        run: npm run ${{ matrix.target == 'edge' && 'zip:edge' || 'zip' }}

      # Uploaded as is, so the download is the zip the store takes, not a zip with that zip inside.
      # The artifact takes the file's name.
      - name: Upload extension zip
        uses: actions/upload-artifact@v7
        with:
          path: .output/dayboard-${{ matrix.target }}.zip
          archive: false
          if-no-files-found: error
